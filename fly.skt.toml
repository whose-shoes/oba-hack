# Fly.io 배포: SKT용 — 첫 화면이 에이닷 연동 데모. 팀마다 앱·볼륨·토큰·데이터가 따로다. 배포 방법은 docs/DEPLOY.md
app = "dont-call-mama-skt"
primary_region = "nrt"

[env]
  OBA_AUDIENCE = "skt"
  OBA_DATA_DIR = "/data"
  OBA_PORT = "8080"
  OBA_DEMO_MODE = "1"
  TZ = "Asia/Seoul"
  # 공개 데모라 OpenAI 추정 비용이 하루 $5를 넘으면 LLM을 쉬고 규칙 기반으로 처리 (사용량은 /admin)
  OBA_LLM_DAILY_USD_LIMIT = "5"

[http_service]
  internal_port = 8080
  force_https = true
  # vooy 5분 폴링·웹훅 재시도가 끊기지 않도록 항상 켜 둔다 (SQLite 볼륨이라 머신은 1대)
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[mounts]
  source = "dcm_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
