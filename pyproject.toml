[project]
name = "oba-hack"
version = "0.1.0"
description = "엄마의 전화 주문을 대신 처리하는 에이전트"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
oba-hack = "oba_hack:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]
